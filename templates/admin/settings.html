{% extends "admin/base.html" %}
{% block title %}Pengaturan{% endblock %}
{% block heading %}Pengaturan Toko{% endblock %}
{% block content %}
<form action="/admin/settings" method="post" class="settings-form">
    <div class="card">
        <h3>Identitas Toko</h3>
        <div class="form-field"><label>Nama Toko</label><input type="text" name="store_name" class="form-input" value="{{ settings.store_name }}"></div>
        <div class="form-field"><label>Tagline</label><input type="text" name="tagline" class="form-input" value="{{ settings.tagline }}"></div>
        <div class="form-field"><label>Deskripsi</label><textarea name="description" class="form-input" rows="3">{{ settings.description }}</textarea></div>
        <div class="form-grid-2">
            <div class="form-field"><label>URL Logo</label><input type="text" name="logo_url" id="logoUrl" class="form-input" value="{{ settings.logo_url }}"><button type="button" class="btn btn-ghost btn-sm upload-trigger" data-target="logoUrl">{{ "camera"|icon|safe }} Upload</button></div>
            <div class="form-field"><label>URL Gambar Hero</label><input type="text" name="hero_image_url" id="heroUrl" class="form-input" value="{{ settings.hero_image_url }}"><button type="button" class="btn btn-ghost btn-sm upload-trigger" data-target="heroUrl">{{ "camera"|icon|safe }} Upload</button></div>
        </div>
    </div>

    <div class="card">
        <h3>Kontak &amp; Sosial Media</h3>
        <div class="form-grid-2">
            <div class="form-field"><label>Telepon</label><input type="text" name="phone" class="form-input" value="{{ settings.phone }}"></div>
            <div class="form-field"><label>WhatsApp</label><input type="text" name="whatsapp" class="form-input" value="{{ settings.whatsapp }}"></div>
            <div class="form-field"><label>Email</label><input type="email" name="email" class="form-input" value="{{ settings.email }}"></div>
            <div class="form-field"><label>Alamat</label><input type="text" name="address" class="form-input" value="{{ settings.address }}"></div>
            <div class="form-field"><label>Instagram (username)</label><input type="text" name="instagram" class="form-input" value="{{ settings.instagram }}"></div>
            <div class="form-field"><label>Facebook (URL)</label><input type="text" name="facebook" class="form-input" value="{{ settings.facebook }}"></div>
            <div class="form-field"><label>TikTok (URL)</label><input type="text" name="tiktok" class="form-input" value="{{ settings.tiktok }}"></div>
        </div>
    </div>

    <div class="card">
        <h3>Pengiriman &amp; Pajak</h3>
        <div class="form-grid-2">
            <div class="form-field"><label>Mata Uang</label><input type="text" name="currency" class="form-input" value="{{ settings.currency }}"></div>
            <div class="form-field"><label>Ongkir Flat</label><input type="number" name="shipping_flat" class="form-input" value="{{ settings.shipping_flat }}"></div>
            <div class="form-field"><label>Gratis Ongkir Min. Belanja</label><input type="number" name="shipping_free_min" class="form-input" value="{{ settings.shipping_free_min }}"></div>
            <div class="form-field"><label>Pajak (%)</label><input type="number" step="0.1" name="tax_percent" class="form-input" value="{{ settings.tax_percent }}"></div>
        </div>
    </div>

    <div class="card">
        <h3>SEO &amp; Pengumuman</h3>
        <div class="form-field"><label>Meta Keywords</label><input type="text" name="meta_keywords" class="form-input" value="{{ settings.meta_keywords }}" placeholder="kata kunci, dipisah, koma"></div>
        <div class="form-field"><label>Teks Pengumuman (banner atas)</label><input type="text" name="announcement" class="form-input" value="{{ settings.announcement }}" placeholder="Gratis ongkir hari ini!"></div>
        <label class="checkbox-row"><input type="checkbox" name="announcement_on" {% if settings.announcement_on %}checked{% endif %}> <span>Tampilkan pengumuman</span></label>
    </div>

    <div class="sticky-save"><button type="submit" class="btn btn-primary btn-lg">Simpan Pengaturan</button></div>
</form>
{% endblock %}
{% block scripts %}<script src="/static/js/upload.js" defer></script>{% endblock %}
